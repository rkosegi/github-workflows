---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -c=.yamllint.yaml
  - repo: https://github.com/santhosh-tekuri/jsonschema
    rev: cmd/jv/0.8.0
    hooks:
      - id: jsonschema-validate
        name: Validate Dependabot config against schema
        files: ^\.github\/dependabot\.(yml|yaml)$
        args:
          - https://www.schemastore.org/dependabot-2.0.json
      - id: jsonschema-validate
        name: Validate GitHub workflows against schema
        files: ^\.github\/workflows\/.*\.yaml$
        args:
          - https://www.schemastore.org/github-workflow.json
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
